<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style type="text/tailwindcss">
      @theme {
        --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
        /* Navy — #01065c — primary text, headings, dark accents */
        --color-navy-50: #eef0ff;
        --color-navy-100: #dde1ff;
        --color-navy-200: #b3baed;
        --color-navy-300: #8089d0;
        --color-navy-400: #4f58a8;
        --color-navy-500: #2a3385;
        --color-navy-600: #151c6e;
        --color-navy-700: #01065c;
        --color-navy-800: #010450;
        --color-navy-900: #010340;
        --color-navy-950: #000220;
        /* Green — #37d31c — CTAs, highlights, accents */
        --color-accent-50: #edfce8;
        --color-accent-100: #d5f9cc;
        --color-accent-200: #aaf29a;
        --color-accent-300: #72e65a;
        --color-accent-400: #4cdb2f;
        --color-accent-500: #37d31c;
        --color-accent-600: #28a814;
        --color-accent-700: #1f8010;
        --color-accent-800: #1a6510;
        --color-accent-900: #155310;
        /* Teal — #3e83a6 — secondary, links, badges */
        --color-teal-50: #eef7fb;
        --color-teal-100: #d5ecf5;
        --color-teal-200: #aed8eb;
        --color-teal-300: #7bbdd9;
        --color-teal-400: #539fc2;
        --color-teal-500: #3e83a6;
        --color-teal-600: #336d8c;
        --color-teal-700: #2a5872;
        --color-teal-800: #224860;
        --color-teal-900: #1c3c52;
      }
    </style>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    {% seo %}
    {% feed_meta %}
  </head>
  <body class="min-h-screen flex flex-col bg-gray-50 text-gray-900 font-sans antialiased">
    {% include header.html %}
    <main class="flex-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
