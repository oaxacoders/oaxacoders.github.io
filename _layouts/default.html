<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700;800;900&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <style type="text/tailwindcss">
      @theme {
        --font-sans: 'Barlow Semi Condensed', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'Martian Mono', ui-monospace, monospace;

        --color-anil: #01065C;
        --color-anil-900: #000340;
        --color-crema: #FFF6E3;
        --color-chapulin: #37D31C;
        --color-rosa: #E4007C;
        --color-rosa-700: #B80064;
        --color-cempasuchil: #FFC629;
        --color-turquesa: #009AA8;
        --color-turquesa-700: #007A85;

        --radius-sm: 6px;
        --radius-md: 12px;
      }

      body { font-family: var(--font-sans); }

      .font-mono { font-family: var(--font-mono); }
      .font-display { font-family: var(--font-sans); font-weight: 900; letter-spacing: -0.015em; }

      .label-mono {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* Prose per BRIEF 3.5 */
      .prose {
        color: var(--color-anil);
      }
      .prose h2 {
        font-size: 34px;
        line-height: 1.05;
        font-weight: 900;
        color: var(--color-anil);
        margin-top: 2.25rem;
        margin-bottom: 1rem;
      }
      .prose h3 {
        font-size: 24px;
        line-height: 1.1;
        font-weight: 800;
        color: var(--color-anil);
        margin-top: 1.75rem;
        margin-bottom: 0.6rem;
      }
      .prose p {
        font-size: 20px;
        line-height: 1.5;
        margin-bottom: 1rem;
        text-align: left;
        max-width: 68ch;
      }
      .prose a {
        color: var(--color-anil);
        text-decoration: underline;
        text-decoration-color: var(--color-rosa);
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
      }
      .prose a:hover { color: var(--color-rosa); }
      .prose strong { color: var(--color-anil); font-weight: 800; }
      .prose ul, .prose ol { padding-left: 1.5rem; margin-bottom: 1rem; max-width: 68ch; }
      .prose ul { list-style-type: disc; }
      .prose ol { list-style-type: decimal; }
      .prose li { margin-bottom: 0.35rem; font-size: 20px; line-height: 1.5; }
      .prose li::marker { color: var(--color-rosa); }
      .prose code {
        font-family: var(--font-mono);
        background: #ffffff;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
      }
      .prose pre {
        background: var(--color-anil);
        color: var(--color-crema);
        padding: 1rem 1.25rem;
        border-radius: 12px;
        overflow-x: auto;
        margin-bottom: 1.25rem;
      }
      .prose pre code { background: transparent; color: inherit; padding: 0; }
      .prose blockquote {
        border-left: 4px solid var(--color-rosa);
        padding-left: 1rem;
        margin: 1rem 0;
        color: var(--color-anil);
      }
      .prose img { border-radius: 12px; margin: 1.25rem 0; }

      /* Focus visible global */
      a:focus-visible, button:focus-visible, input:focus-visible {
        outline: 3px solid var(--color-anil);
        outline-offset: 2px;
      }
      .on-anil a:focus-visible, .on-anil button:focus-visible, .on-anil input:focus-visible {
        outline-color: var(--color-cempasuchil);
      }
    </style>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    {% seo %}
    {% feed_meta %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Oaxacoders",
      "url": "{{ site.url }}",
      "description": "{{ site.description }}",
      "logo": "{{ site.url }}/android-chrome-512x512.png",
      "image": "{{ site.url }}/assets/images/oaxacoders.svg",
      "foundingLocation": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Oaxaca de Juárez",
          "addressRegion": "Oaxaca",
          "addressCountry": "MX"
        }
      },
      "areaServed": {
        "@type": "City",
        "name": "Oaxaca de Juárez"
      },
      "sameAs": [
        "{{ site.community.telegram }}",
        "{{ site.community.whatsapp }}",
        "{{ site.community.twitter }}",
        "{{ site.community.bluesky }}",
        "{{ site.community.github }}"
      ]
    }
    </script>
  </head>
  <body class="min-h-screen flex flex-col bg-crema text-anil font-sans antialiased">
    {% include header.html %}
    <main class="flex-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
