---
layout: default
---
<article class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
  <a href="/blog/" class="inline-flex items-center gap-1 text-sm text-gray-400 hover:text-teal-500 transition mb-8">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Todos los posts
  </a>

  <header class="mb-10">
    <h1 class="text-3xl sm:text-4xl font-bold text-navy-700 mb-4 leading-tight">{{ page.title }}</h1>
    <p class="text-gray-400 text-sm">
      {{ page.date | date: "%d de %B, %Y" }}
      {% if page.author %} &middot; {{ page.author }}{% endif %}
    </p>
  </header>

  <div class="prose prose-gray max-w-none leading-relaxed text-gray-600">
    {{ content }}
  </div>
</article>
