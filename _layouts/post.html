---
layout: default
---
<article class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16">
  <a href="/blog/" class="inline-flex items-center gap-1 label-mono text-anil/70 hover:text-rosa transition mb-8">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
    Todos los posts
  </a>

  <header class="mb-10">
    <p class="font-mono text-[14px] text-anil/70 mb-3">
      {{ page.date | date: "%d de %B, %Y" }}
      {% if page.author %} &middot; {{ page.author }}{% endif %}
    </p>
    <h1 class="font-display text-[40px] sm:text-[56px] md:text-[72px] text-anil leading-[0.95] mb-4">{{ page.title }}</h1>
  </header>

  <div class="prose max-w-none">
    {{ content }}
  </div>
</article>
