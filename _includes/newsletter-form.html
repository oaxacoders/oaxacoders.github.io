<div class="bg-white rounded-[12px] p-6 sm:p-8">
  <h3 class="text-[26px] font-extrabold text-anil mb-2 leading-tight">Suscríbete al newsletter</h3>
  <p class="text-[17px] text-anil/80 mb-5">Recibe noticias sobre eventos y actividades de la comunidad.</p>
  <form
    action="https://buttondown.com/api/emails/embed-subscribe/oaxacoders"
    method="post"
    target="popupwindow"
    class="flex flex-col sm:flex-row gap-3">
    <label class="sr-only" for="newsletter-email">Correo electrónico</label>
    <input
      id="newsletter-email"
      type="email"
      name="email"
      placeholder="tu@email.com"
      required
      class="flex-1 h-12 px-4 text-[17px] rounded-[6px] border-2 border-anil bg-white text-anil placeholder-anil/50 focus:outline-none focus:border-rosa" />
    <button
      type="submit"
      class="shrink-0 h-12 px-6 rounded-[6px] bg-rosa text-white text-[17px] font-extrabold hover:bg-rosa-700 transition">
      Suscribirse
    </button>
  </form>
</div>
